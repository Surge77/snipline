[pytest]
testpaths = tests
pythonpath = src
addopts = -q --strict-markers

# QT_QPA_PLATFORM=offscreen is set in tests/conftest.py rather than here, because it
# must be set before PySide6 is imported and pytest.ini would need the pytest-env plugin.

markers =
    slow: takes more than a second
    gui: needs a QApplication (qtbot); still headless
