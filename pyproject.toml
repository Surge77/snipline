[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "snipline"
version = "0.1.0"
description = "Windows screenshot tool with a vector annotation editor, correct on multi-monitor mixed-DPI setups"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Tejas Deshmane" }]
keywords = ["screenshot", "annotation", "windows", "qt", "pyside6"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
]
dependencies = [
    "PySide6==6.11.1",
    "mss==10.2.0",
    "pillow==12.3.0",
    "numpy==2.4.6",
]

[project.urls]
Homepage = "https://github.com/Surge77/snipline"
Issues = "https://github.com/Surge77/snipline/issues"

[project.gui-scripts]
snipline = "snipline.app:main"

# A console script, not a GUI one: this tool prints to stdout and is meant to be run from a
# terminal to diagnose capture geometry without any UI in the way.
[project.scripts]
snipline-grab = "snipline.tools.grab:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["snipline"]

[tool.coverage.run]
source = ["src/snipline"]
branch = true

[tool.coverage.report]
# platform/ is Win32 shim code with no meaningful test seam; it is covered by
# docs/MANUAL_TESTS.md instead. See D9.
omit = ["src/snipline/platform/hotkey.py", "src/snipline/platform/clipboard_win.py"]
